name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The Release workflow runs CI on the release commit before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        if: runner.os == 'macOS'
        run: go test -race ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...
      # Linux also measures coverage across every package, including code the
      # end-to-end tests in main_test.go exercise
      - name: Test (with coverage)
        if: runner.os == 'Linux'
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Upload coverage to Coveralls
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          # A Coveralls outage shouldn't fail CI
          fail-on-error: false

  min-go:
    name: Test (minimum Go version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  # The benchmark and its reference solutions are separate Go modules, so the
  # jobs above don't build or test them
  benchmark:
    name: Benchmark (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [benchmark, benchmark/reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
