# GoReleaser configuration: https://goreleaser.com/customization/
version: 2

project_name: goforge

builds:
  - id: goforge
    main: .
    binary: goforge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Reproducible binaries: file times come from the commit, not the build machine
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/Frank5ive/goforge/cmd.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The Release workflow passes the version's CHANGELOG.md section as the notes
changelog:
  disable: true

release:
  # Uploaded as a draft; the Release workflow publishes it once every asset is
  # there, so a release never appears half-uploaded
  draft: true
  # A re-run replaces the draft an unfinished run left behind
  replace_existing_draft: true
  # v1.2.0-rc.1 and similar are marked as prereleases
  prerelease: auto
